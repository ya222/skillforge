[project]
name = "skillforge"
version = "0.1.0"
description = "A versioned library of portable AI agent skills, with a Kustomize-style composition layer for importing, configuring and extending them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.scripts]
skillforge = "skillforge.cli:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/skillforge"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
# The source cache holds checkouts of other people's repositories.
extend-exclude = [".skillforge"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
