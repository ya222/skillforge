# Layer 2 of 3: the team.
#
# Narrows the org defaults to how this team actually works, and adds context at
# an anchor nobody above has claimed. No conflict, so nothing needs forcing.
version: 1

extends:
  - ../org

skills:
  - from: lib/eli5
    patches:
      - point: after-intro
        op: insert
        content: |
          > Platform team convention: every explainer links the dashboard that
          > shows the thing it explains.

shared_params:
  max_words: 200
