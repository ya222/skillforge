# Layer 3 of 3: the project. This is the layer that gets built.
#
# Overrides a param the org set, narrows one the team inherited, and takes over
# an anchor the org already patched.
version: 1

extends:
  - ../team

params:
  audience: an on-call engineer at 3am

skills:
  - from: lib/eli5
    params:
      max_words: 120

    patches:
      # The org appended a rule to this block. This is an internal tooling
      # service with no customers, so the rule is noise here and the project
      # takes the target over. `force: true` is what makes that legal, and
      # what leaves a record in the config that the override was deliberate.
      #
      # Forcing replaces the org's patch rather than stacking on it, so anything
      # from the org rule that should survive has to be restated here.
      #
      # Remove `force: true` and rebuild to see the conflict error instead.
      - block: rules
        op: append
        force: true
        content: "- Lead with what to do, then why; the why can wait until the pager is quiet"
