# A worked example of a repository that consumes skills instead of owning them.
#
# It does two things that matter:
#   1. imports this library over git and configures it with params and anchors
#   2. imports the same skill's upstream, anthropics/claude-plugins-community,
#      which knows nothing about skillforge, and patches it by hash-pinned
#      heading path
#
# Build it with: skillforge build --root examples/consumer
version: 1

sources:
  # ssh, because this repository is currently private. Switch to the https URL
  # if and when it goes public.
  lib:
    git: git@github.com:ya222/skillforge.git
    ref: main
  upstream:
    git: https://github.com/anthropics/claude-plugins-community.git
    ref: main
    path: eli5/skills

params:
  audience: a product manager who has never opened the codebase
  max_words: 300

skills:
  # Configured through the contract the base skill offers.
  - from: lib/eli5
    params:
      # This repository's explainers land in pull request descriptions, so the
      # `artifact` block disappears and the `markdown` block takes its place.
      medium: markdown
    patches:
      - point: after-intro
        op: insert
        content: |
          > Explainers here describe *our* system. Name the real service, queue
          > or table; never a made-up stand-in.
      - block: rules
        op: append
        content: "- Link the runbook or ADR the explainer is summarising, if one exists"

  # Imported straight from a repository that has never heard of skillforge: no
  # anchors, no params, nothing to cooperate with. Patched by heading path,
  # which is why the section's content hash has to be pinned.
  - from: upstream/eli5
    as: eli5-upstream
    patches:
      - heading: "eli5"
        op: append
        upstream_hash: sha256:38064caba9aae8761094ec2b4ba9d64f907fec024ae28f15d2faf3b362129591
        content: |
          End with the one sentence the reader should be able to repeat afterwards.

targets:
  claude-code: {}
  agents-md: {}
  copilot: {}
  cursor: {}

output: .agents/skills
