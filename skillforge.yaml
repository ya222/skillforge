# skillforge builds its own skills with itself. If the tool is awkward to use,
# this file is where we feel it first.
version: 1

skills:
  - from: ./skills/eli5
  - from: ./skills/eli12
    params:
      max_words: 1000
      medium: markdown
  - from: ./skills/isometric-system-map
  - from: ./skills/dev-style
  - from: ./skills/handoff
  - from: ./skills/grill-me
  - from: ./skills/frontend-design
  - from: ./skills/skill-creator
  - from: ./skills/architecture-designer
  - from: ./skills/architect-review
  - from: ./skills/claude-session-limits
  - from: ./skills/markdown-kanban
  - from: ./skills/cloudflare-quick-tunnel

targets:
  claude-code: {}
  agents-md: {}

output: .agents/skills
